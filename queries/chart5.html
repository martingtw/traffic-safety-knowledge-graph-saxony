<!-- Angepasst von d3-graph-gallery.com Barplot-Beispiel -->
<!-- Erwartet result5.csv im selben Ordner mit Spalten: name,area_km2,blitzer,blitzer_pro_km2 -->
<!DOCTYPE html>
<meta charset="utf-8">

<div id="my_dataviz"></div>

<script src="https://d3js.org/d3.v4.js"></script>
<script>

var margin = {top: 30, right: 30, bottom: 140, left: 90},
    width = 700 - margin.left - margin.right,
    height = 500 - margin.top - margin.bottom;

var svg = d3.select("#my_dataviz")
  .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
  .append("g")
    .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

d3.csv("result5.csv", function(data) {

  // Nach Blitzerdichte sortieren, nur Top 10
  data.sort(function(a, b) { return b.blitzer_pro_km2 - a.blitzer_pro_km2; });
  data = data.slice(0, 20);

  var x = d3.scaleBand()
    .range([0, width])
    .domain(data.map(function(d) { return d.name; }))
    .padding(0.4);
  svg.append("g")
    .attr("transform", "translate(0," + height + ")")
    .call(d3.axisBottom(x))
    .selectAll("text")
      .attr("transform", "translate(-10,0)rotate(-45)")
      .style("text-anchor", "end");

  var y = d3.scaleLinear()
    .domain([0, d3.max(data, function(d) { return +d.blitzer_pro_km2; })])
    .range([height, 0]);
  svg.append("g")
    .call(d3.axisLeft(y));

  svg.selectAll("mybar")
    .data(data)
    .enter()
    .append("rect")
      .attr("x", function(d) { return x(d.name); })
      .attr("y", function(d) { return y(d.blitzer_pro_km2); })
      .attr("width", x.bandwidth())
      .attr("height", function(d) { return height - y(d.blitzer_pro_km2); })
      .attr("fill", "#69b3a2");

  svg.append("text")
    .attr("x", -height / 2)
    .attr("y", -45)
    .attr("transform", "rotate(-90)")
    .style("text-anchor", "middle")
    .text("Blitzer pro km²");

})

</script>
