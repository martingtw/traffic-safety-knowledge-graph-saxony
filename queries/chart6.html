<!-- Angepasst von d3-graph-gallery.com Bubble-Plot-Beispiel -->
<!-- Erwartet result6.csv im selben Ordner mit Spalten: latitude,longitude,accidentCategoryCode -->
<!-- Hinweis: Da nur 2 Koordinaten + 1 Kategorie vorhanden sind (keine dritte numerische -->
<!-- Größenvariable wie beim Original-pop), entfällt die Radius-Skala (z) und Größen-Legende. -->
<!-- longitude -> X-Achse, latitude -> Y-Achse ergibt eine grobe (unprojizierte) Karte. -->
<!DOCTYPE html>
<meta charset="utf-8">

<div id="my_dataviz"></div>

<script src="https://d3js.org/d3.v4.js"></script>
<script src="https://d3js.org/d3-scale-chromatic.v1.min.js"></script>

<style>
.bubbles {
  stroke-width: 1px;
  stroke: black;
  opacity: .8
}
.bubbles:hover {
  stroke: black;
}
.tooltip {
  position: absolute;
}
</style>

<script>

var margin = {top: 40, right: 150, bottom: 60, left: 60},
    width = 600 - margin.left - margin.right,
    height = 550 - margin.top - margin.bottom;

var svg = d3.select("#my_dataviz")
  .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
  .append("g")
    .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

// Label-Mapping (identisch zu chart3.html)
var labels = {
  "1": "Getötete",
  "2": "Schwerverletzte",
  "3": "Leichtverletzte"
};
var allgroups = ["1", "2", "3"];

d3.csv("result6.csv", function(d) {
  return {
    latitude: +d.latitude,
    longitude: +d.longitude,
    accidentCategoryCode: d.accidentCategoryCode
  };
}, function(data) {

  // ---------------------------//
  //       AXIS  AND SCALE      //
  // ---------------------------//

  // X-Achse: longitude (dynamisch aus den Daten statt fixer GDP-Range)
  var x = d3.scaleLinear()
    .domain(d3.extent(data, function(d) { return d.longitude; }))
    .range([0, width]);
  svg.append("g")
    .attr("transform", "translate(0," + height + ")")
    .call(d3.axisBottom(x).ticks(5));

  svg.append("text")
      .attr("text-anchor", "end")
      .attr("x", width)
      .attr("y", height + 45)
      .text("Longitude");

  // Y-Achse: latitude
  var y = d3.scaleLinear()
    .domain(d3.extent(data, function(d) { return d.latitude; }))
    .range([height, 0]);
  svg.append("g")
    .call(d3.axisLeft(y));

  svg.append("text")
      .attr("text-anchor", "start")
      .attr("x", 0)
      .attr("y", -20)
      .text("Latitude");

  // Farbskala nach Unfallkategorie statt Kontinent
  var myColor = d3.scaleOrdinal()
    .domain(allgroups)
    .range(d3.schemeSet1);

  // ---------------------------//
  //      TOOLTIP               //
  // ---------------------------//

  var tooltip = d3.select("#my_dataviz")
    .append("div")
      .style("opacity", 0)
      .attr("class", "tooltip")
      .style("background-color", "black")
      .style("border-radius", "5px")
      .style("padding", "10px")
      .style("color", "white");

  var showTooltip = function(d) {
    tooltip.transition().duration(200);
    tooltip
      .style("opacity", 1)
      .html("Kategorie: " + (labels[d.accidentCategoryCode] || d.accidentCategoryCode))
      .style("left", (d3.mouse(this)[0] + 30) + "px")
      .style("top", (d3.mouse(this)[1] + 30) + "px");
  }
  var moveTooltip = function(d) {
    tooltip
      .style("left", (d3.mouse(this)[0] + 30) + "px")
      .style("top", (d3.mouse(this)[1] + 30) + "px");
  }
  var hideTooltip = function(d) {
    tooltip.transition().duration(200).style("opacity", 0);
  }

  // ---------------------------//
  //       HIGHLIGHT GROUP      //
  // ---------------------------//

  var highlight = function(d) {
    d3.selectAll(".bubbles").style("opacity", .05);
    d3.selectAll(".cat" + d).style("opacity", 1);
  }
  var noHighlight = function(d) {
    d3.selectAll(".bubbles").style("opacity", 1);
  }

  // ---------------------------//
  //       CIRCLES              //
  // ---------------------------//

  // Feste Radiusgröße (r=4), da keine dritte numerische Variable vorliegt
  svg.append('g')
    .selectAll("dot")
    .data(data)
    .enter()
    .append("circle")
      .attr("class", function(d) { return "bubbles cat" + d.accidentCategoryCode; })
      .attr("cx", function(d) { return x(d.longitude); })
      .attr("cy", function(d) { return y(d.latitude); })
      .attr("r", 4)
      .style("fill", function(d) { return myColor(d.accidentCategoryCode); })
      .on("mouseover", showTooltip)
      .on("mousemove", moveTooltip)
      .on("mouseleave", hideTooltip);

  // ---------------------------//
  //       LEGEND (Kategorie)   //
  // ---------------------------//

  var size = 20;
  svg.selectAll("myrect")
    .data(allgroups)
    .enter()
    .append("circle")
      .attr("cx", width + 20)
      .attr("cy", function(d, i) { return 10 + i * (size + 5); })
      .attr("r", 7)
      .style("fill", function(d) { return myColor(d); })
      .on("mouseover", highlight)
      .on("mouseleave", noHighlight);

  svg.selectAll("mylabels")
    .data(allgroups)
    .enter()
    .append("text")
      .attr("x", width + 20 + size * .8)
      .attr("y", function(d, i) { return i * (size + 5) + (size / 2); })
      .style("fill", function(d) { return myColor(d); })
      .text(function(d) { return labels[d]; })
      .attr("text-anchor", "left")
      .style("alignment-baseline", "middle")
      .style("font-size", 12)
      .on("mouseover", highlight)
      .on("mouseleave", noHighlight);

})

</script>
