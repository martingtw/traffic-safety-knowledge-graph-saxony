<!-- Angepasst von d3-graph-gallery.com Pie-Chart-Beispiel -->
<!-- Erwartet result3.csv im selben Ordner mit Spalten: accidentCategoryCode,anzahl -->
<!DOCTYPE html>
<meta charset="utf-8">

<div id="my_dataviz"></div>

<script src="https://d3js.org/d3.v4.js"></script>
<script src="https://d3js.org/d3-scale-chromatic.v1.min.js"></script>

<script>

var width = 450
    height = 450
    margin = 40

var radius = Math.min(width, height) / 2 - margin

var svg = d3.select("#my_dataviz")
  .append("svg")
    .attr("width", width)
    .attr("height", height)
  .append("g")
    .attr("transform", "translate(" + width / 2 + "," + height / 2 + ")");

// Mapping der Codes auf lesbare Labels (aus dem TTL-Kommentar von ex:accidentCategoryCode)
var labels = {
  "1": "Getötete",
  "2": "Schwerverletzte",
  "3": "Leichtverletzte"
};

// Daten aus der SPARQL-CSV laden statt Dummy-Daten
d3.csv("result3.csv", function(d) {
  return {
    key: labels[d.accidentCategoryCode] || d.accidentCategoryCode,
    value: +d.anzahl
  };
}, function(data) {

  var color = d3.scaleOrdinal()
    .domain(data.map(function(d) { return d.key; }))
    .range(d3.schemeSet2);

  var pie = d3.pie()
    .value(function(d) { return d.value; });
  var data_ready = pie(data);

  var arcGenerator = d3.arc()
    .innerRadius(0)
    .outerRadius(radius);

  svg
    .selectAll('mySlices')
    .data(data_ready)
    .enter()
    .append('path')
      .attr('d', arcGenerator)
      .attr('fill', function(d) { return color(d.data.key); })
      .attr("stroke", "black")
      .style("stroke-width", "2px")
      .style("opacity", 0.7);

  svg
    .selectAll('mySlices')
    .data(data_ready)
    .enter()
    .append('text')
    .text(function(d) { return d.data.key + " (" + d.data.value + ")"; })
    .attr("transform", function(d) { return "translate(" + arcGenerator.centroid(d) + ")"; })
    .style("text-anchor", "middle")
    .style("font-size", 14);

});

</script>
