<!-- Angepasst von d3-graph-gallery.com Barplot-Beispiel -->
<!-- Erwartet result5.csv im selben Ordner mit Spalten: name,population,cars_pkw,pkw_pro_1000_ew -->
<!-- Query liefert bereits nur die Top 20 (siehe ORDER BY DESC(?pkw_pro_1000_ew) LIMIT 20) -->
<!DOCTYPE html>
<meta charset="utf-8">

<div id="my_dataviz"></div>

<script src="https://d3js.org/d3.v4.js"></script>
<script>

var margin = {top: 30, right: 30, bottom: 140, left: 70},
    width = 900 - margin.left - margin.right,
    height = 600 - margin.top - margin.bottom;

var svg = d3.select("#my_dataviz")
  .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
  .append("g")
    .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

d3.csv("result9.csv", function(data) {

  data.forEach(function(d) { d.pkw_pro_1000_ew = +d.pkw_pro_1000_ew; });
  data.sort(function(a, b) { return b.pkw_pro_1000_ew - a.pkw_pro_1000_ew; });

  var x = d3.scaleBand()
    .range([0, width])
    .domain(data.map(function(d) { return d.name; }))
    .padding(0.4);
  svg.append("g")
    .attr("transform", "translate(0," + height + ")")
    .call(d3.axisBottom(x))
    .selectAll("text")
      .attr("transform", "translate(-10,0)rotate(-45)")
      .style("text-anchor", "end")
      .style("font-size", "11px");

  var y = d3.scaleLinear()
    .domain([0, d3.max(data, function(d) { return d.pkw_pro_1000_ew; })])
    .range([height, 0]);
  svg.append("g")
    .call(d3.axisLeft(y));

  svg.selectAll("mybar")
    .data(data)
    .enter()
    .append("rect")
      .attr("x", function(d) { return x(d.name); })
      .attr("y", function(d) { return y(d.pkw_pro_1000_ew); })
      .attr("width", x.bandwidth())
      .attr("height", function(d) { return height - y(d.pkw_pro_1000_ew); })
      .attr("fill", "#4682b4");

  // Achsentitel
  svg.append("text")
    .attr("x", -height / 2)
    .attr("y", -50)
    .attr("transform", "rotate(-90)")
    .style("text-anchor", "middle")
    .text("PKW pro 1.000 Einwohner");

});

</script>
