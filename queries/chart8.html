<!-- Angepasst von d3-graph-gallery.com Scatterplot-Beispiel -->
<!-- Erwartet result4.csv im selben Ordner mit Spalten: name,area_km2,population,blitzer,unfaelle,blitzerdichte,unfallrate -->
<!-- Blasengröße kodiert die Einwohnerzahl der Gemeinde -->
<!DOCTYPE html>
<meta charset="utf-8">

<div id="my_dataviz"></div>

<script src="https://d3js.org/d3.v4.js"></script>
<script>

var margin = {top: 30, right: 30, bottom: 60, left: 70},
    width = 1000 - margin.left - margin.right,
    height = 700 - margin.top - margin.bottom;

var svg = d3.select("#my_dataviz")
  .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
  .append("g")
    .attr("transform", "translate(" + margin.left + "," + margin.top + ")");


d3.csv("result8.csv", function(data) {

  data.forEach(function(d) {
    d.blitzerdichte = +d.blitzerdichte;
    d.unfallrate = +d.unfallrate;
    d.population = +d.population;
  });

  // X-Achse: Blitzerdichte (Blitzer pro km2)
  var x = d3.scaleLinear()
    .domain([0, d3.max(data, function(d) { return d.blitzerdichte; }) * 1.05])
    .range([0, width]);
  svg.append("g")
    .attr("transform", "translate(0," + height + ")")
    .call(d3.axisBottom(x));

  // Y-Achse: Unfallrate pro 1.000 Einwohner
  var y = d3.scaleLinear()
    .domain([0, d3.max(data, function(d) { return d.unfallrate; }) * 1.05])
    .range([height, 0]);
  svg.append("g")
    .call(d3.axisLeft(y));

  // Blasengröße nach Einwohnerzahl
  var z = d3.scaleSqrt()
    .domain([0, d3.max(data, function(d) { return d.population; })])
    .range([2, 18]);

  // Punkte, teiltransparent wegen der vielen Gemeinden ohne Blitzer (x=0)
  svg.append('g')
    .selectAll("dot")
    .data(data)
    .enter()
    .append("circle")
      .attr("cx", function(d) { return x(d.blitzerdichte); })
      .attr("cy", function(d) { return y(d.unfallrate); })
      .attr("r", function(d) { return z(d.population); })
      .style("fill", "#69b3a2")
      .style("opacity", 0.5)
      .style("stroke", "black")
      .style("stroke-width", 0.5);

  // Achsentitel
  svg.append("text")
    .attr("x", width / 2)
    .attr("y", height + 45)
    .style("text-anchor", "middle")
    .text("Blitzerdichte (Messstellen pro km²)");

  svg.append("text")
    .attr("x", -height / 2)
    .attr("y", -50)
    .attr("transform", "rotate(-90)")
    .style("text-anchor", "middle")
    .text("Unfälle pro 1.000 Einwohner");

  // Hinweistext: Anteil Gemeinden ohne Blitzer
  var ohneBlitzer = data.filter(function(d) { return d.blitzerdichte === 0; }).length;
  svg.append("text")
    .attr("x", width - 10)
    .attr("y", 15)
    .style("text-anchor", "end")
    .style("font-size", "12px")
    .style("fill", "#555")
    .text(ohneBlitzer + " von " + data.length + " Gemeinden ohne stationäre Messstelle (x = 0)");

});

</script>
