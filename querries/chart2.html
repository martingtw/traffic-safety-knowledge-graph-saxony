<!-- Angepasst von d3-graph-gallery.com Line-Chart-Beispiel -->
<!-- Erwartet result2.csv im selben Ordner mit Spalten: accidentMonth,anzahl -->
<!DOCTYPE html>
<meta charset="utf-8">

<div id="my_dataviz"></div>

<script src="https://d3js.org/d3.v4.js"></script>
<script>

var margin = {top: 30, right: 30, bottom: 40, left: 60},
    width = 600 - margin.left - margin.right,
    height = 400 - margin.top - margin.bottom;

var svg = d3.select("#my_dataviz")
  .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
  .append("g")
    .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

d3.csv("result2.csv",

  // accidentMonth ist eine Zahl (1-12), kein Datum -> einfach in Number umwandeln
  function(d){
    return { month: +d.accidentMonth, anzahl: +d.anzahl }
  },

  function(data) {

    // sortieren nach Monat, falls SPARQL-Ergebnis nicht sortiert ankommt
    data.sort(function(a, b) { return a.month - b.month; });

    // X-Achse: Monat 1-12, linear statt Zeit
    var x = d3.scaleLinear()
      .domain([1, 12])
      .range([0, width]);
    svg.append("g")
      .attr("transform", "translate(0," + height + ")")
      .call(d3.axisBottom(x).ticks(12).tickFormat(d3.format("d")));

    // Y-Achse
    var y = d3.scaleLinear()
      .domain([0, d3.max(data, function(d) { return d.anzahl; })])
      .range([height, 0]);
    svg.append("g")
      .call(d3.axisLeft(y));

    // Linie
    svg.append("path")
      .datum(data)
      .attr("fill", "none")
      .attr("stroke", "steelblue")
      .attr("stroke-width", 1.5)
      .attr("d", d3.line()
        .x(function(d) { return x(d.month) })
        .y(function(d) { return y(d.anzahl) })
        );

    // Punkte auf der Linie (macht einzelne Monate besser lesbar)
    svg.selectAll("mycircle")
      .data(data)
      .enter()
      .append("circle")
        .attr("cx", function(d) { return x(d.month) })
        .attr("cy", function(d) { return y(d.anzahl) })
        .attr("r", 3)
        .attr("fill", "steelblue");

    // Achsentitel
    svg.append("text")
      .attr("x", width / 2)
      .attr("y", height + 35)
      .style("text-anchor", "middle")
      .text("Monat (2025)");

    svg.append("text")
      .attr("x", -height / 2)
      .attr("y", -45)
      .attr("transform", "rotate(-90)")
      .style("text-anchor", "middle")
      .text("Anzahl Unfälle");

})

</script>
