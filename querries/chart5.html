<!-- Angepasst von d3-graph-gallery.com Scatter-Plot-Beispiel -->
<!-- Erwartet result5.csv im selben Ordner mit Spalten: name,area_km2,blitzer -->
<!DOCTYPE html>
<meta charset="utf-8">

<div id="my_dataviz"></div>

<script src="https://d3js.org/d3.v4.js"></script>
<script>

var margin = {top: 30, right: 30, bottom: 50, left: 70},
    width = 600 - margin.left - margin.right,
    height = 450 - margin.top - margin.bottom;

var svg = d3.select("#my_dataviz")
  .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
  .append("g")
    .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

d3.csv("result5.csv", function(d) {
  return {
    name: d.name,
    area_km2: +d.area_km2,
    blitzer: +d.blitzer
  };
}, function(data) {

  var x = d3.scaleLinear()
    .domain([0, d3.max(data, function(d) { return d.area_km2; })])
    .range([0, width]);
  svg.append("g")
    .attr("transform", "translate(0," + height + ")")
    .call(d3.axisBottom(x));

  var y = d3.scaleLinear()
    .domain([0, d3.max(data, function(d) { return d.blitzer; })])
    .range([height, 0]);
  svg.append("g")
    .call(d3.axisLeft(y));

  svg.append('g')
    .selectAll("dot")
    .data(data)
    .enter()
    .append("circle")
      .attr("cx", function(d) { return x(d.area_km2); })
      .attr("cy", function(d) { return y(d.blitzer); })
      .attr("r", 4)
      .style("fill", "#69b3a2")
      .style("opacity", 0.7);

  // Achsentitel
  svg.append("text")
    .attr("x", width / 2)
    .attr("y", height + 40)
    .style("text-anchor", "middle")
    .text("Gemeindefläche (km²)");

  svg.append("text")
    .attr("x", -height / 2)
    .attr("y", -50)
    .attr("transform", "rotate(-90)")
    .style("text-anchor", "middle")
    .text("Anzahl Blitzer");

});

</script>
